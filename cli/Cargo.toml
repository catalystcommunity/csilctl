[package]
name = "csilctl"
version = "0.1.0"
edition = "2024"
description = "a curl-like CLI for sending arbitrary CSIL messages"

[lib]
name = "csilctl"
path = "src/lib.rs"

[[bin]]
name = "csilctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
csilgen-core = { git = "https://github.com/catalystcommunity/csilgen.git", tag = "csilgen-core/v0.2.1" }
csilgen-transport = { git = "https://github.com/catalystcommunity/csilgen.git", tag = "transport-rust/v0.2.0" }
anyhow = "1.0"
console = "0.15"
serde_json = "1.0"
ciborium = "0.2"
regex = "1"

[dev-dependencies]
tempfile = "3.0"
