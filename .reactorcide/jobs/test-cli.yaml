name: csilctl-test-cli
description: "Run the csilctl CLI test suite."
triggers:
  events:
    - pull_request_opened
    - pull_request_updated
  branches:
    - main
paths:
  include:
    - "cli/**"
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:dev
  command: "cd cli && cargo test --all-features"
  timeout: 900
  priority: 10
  working_dir: /job/src
