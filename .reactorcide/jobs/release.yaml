name: csilctl-release
description: "On merge to main: semver-tag csilctl, cross-build the CLI, and publish a GitHub release."
triggers:
  events:
    - pull_request_merged
    - push
  branches:
    - main
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:dev
  command: "python3 .reactorcide/jobs/scripts/release.py"
  timeout: 1800
  priority: 15
  working_dir: /job/src
  raw_command: true
  disable_run_local: true
  capabilities:
    - builder
  run_as:
    user: root
environment:
  REACTORCIDE_REPO: catalystcommunity/csilctl
  GITHUB_PAT: "${secret:catalystcommunity/ci:githubpat}"
